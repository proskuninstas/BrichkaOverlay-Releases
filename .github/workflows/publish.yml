name: Publish Brichka Overlay

on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read version
        id: version
        shell: python
        run: |
          import json, os, pathlib, re
          version = json.loads(pathlib.Path('release.json').read_text())['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid release version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=v{version}\nversion={version}\n')
      - name: Verify release files
        working-directory: dist
        run: sha256sum --strict -c SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published files.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/BrichkaOverlay-Setup.exe dist/BrichkaOverlay-Portable.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --draft --title "Brichka Overlay $RELEASE_VERSION" --notes-file RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
